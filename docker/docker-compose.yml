services:
  app:
    image: ghcr.io/pixelcop/clientshare:latest
    init: true
    restart: "unless-stopped"
    ports:
      - "8080:8080"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--tries=1",
          "--spider",
          "http://0.0.0.0:8080/api/healthz",
        ]
      interval: 3s
      timeout: 2s
      retries: 3
      start_period: 5s
    volumes:
      - ./config:/app/config
      - ./data:/app/data
      - ./storage:/app/storage
