name: Build on push

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  packages: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: false

      - name: Remote cache
        uses: actions/cache@v4
        if: ${{ runner.environment == 'github-hosted' }}
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}

      - name: Build
        run: |
          make docker-test build-docker PLATFORMS="linux/amd64,linux/arm64" PULL=true PUSH=true

      - name: Cleanup local docker images
        if: ${{ runner.environment == 'self-hosted' }}
        run: |
          # clientshare images
          docker images --format '{{ .Repository }}:{{ .Tag }}' \
            | grep "${REGISTRY}/${IMAGE_NAME}" \
            | xargs -r docker rmi -f

          # runner images
          docker images --format '{{ .Repository }}:{{ .Tag }}' \
            | grep myoung34/github-runner \
            | grep none \
            | xargs -r docker rmi -f

      - name: Cleanup old images from registry
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          tags: "*-next-*"
          older-than: "30 days"
          delete-untagged: true
